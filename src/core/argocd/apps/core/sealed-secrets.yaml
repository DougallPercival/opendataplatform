# Uses bitnami/sealed-secrets's own chart repo (NOT bitnami/charts, the general
# catalog Broadcom put behind a paywall in Aug 2025 — this is a separate,
# still free, still independently-maintained project). The org itself renamed
# from bitnami-labs to bitnami at some point after this file was first written
# — bitnami-labs.github.io/sealed-secrets started 404ing on its index.yaml,
# which is what broke this Application's sync. Re-verified current and
# working on 2026-08-30: https://github.com/bitnami/sealed-secrets — worth a
# quick check before first real install that it hasn't moved again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.3   # appVersion 0.39.1 — check for newer: https://github.com/bitnami/sealed-secrets/releases
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Day-one reminder (ARCHITECTURE.md §8), automated 2026-09-11: once the controller generates its
# encryption key, export it immediately and store it offsite. bootstrap/export-sealed-secrets-key.sh
# does exactly the one-liner this comment used to document by hand —
#   kubectl -n sealed-secrets get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > sealed-secrets-private-key.yaml
# — plus a systemd timer, since the controller rotates its own keypair every 30 days by default (old
# keys are kept, never deleted, so a one-time export silently goes stale the first time rotation
# happens) and optional rclone push to an offsite remote. Run it once by hand right after first
# install rather than waiting for the timer's first scheduled fire: sudo bootstrap/export-sealed-
# secrets-key.sh && sudo /usr/local/bin/sealed-secrets-key-export.sh. See that script's own header
# for the full design writeup. Its output directory (default /var/backups/sealed-secrets-keys) is
# NOT inside this git repo at all — nothing here needs a .gitignore entry the way the old manual
# one-liner's ad hoc output file did.
