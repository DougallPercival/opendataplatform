# The actual database — a plain-manifests Application (not Helm), since this
# is one Cluster custom resource, not a chart. Wave 1 so postgres-operator's
# CRDs (wave 0) are already registered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-cluster
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: src/core/argocd/manifests
    directory:
      include: "postgres-cluster.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
