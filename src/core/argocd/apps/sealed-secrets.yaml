# NOTE: uses bitnami-labs/sealed-secrets (the upstream project's own chart repo),
# not bitnami/charts (the general catalog Broadcom put behind a paywall in Aug
# 2025) — a different, still-maintained repo. Worth a quick check before first
# real install that this hasn't moved again: https://github.com/bitnami-labs/sealed-secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.1   # check for newer: https://github.com/bitnami-labs/sealed-secrets/releases
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Day-one reminder (ARCHITECTURE.md §8): once the controller generates its
# encryption key, export it immediately and store it offsite —
#   kubectl -n sealed-secrets get secret -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > sealed-secrets-private-key.yaml
# This file is in .gitignore on purpose. Losing it makes every SealedSecret unreadable.
