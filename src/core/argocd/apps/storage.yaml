# Longhorn — replicated block storage across nodes (ARCHITECTURE.md §6/§8).
# Prerequisite on each node that will host storage: open-iscsi (or iscsi-initiator-utils)
# installed and the iscsid service running — bootstrap/install.sh warns if it's
# missing but doesn't install it for you (it's a host package, not a k8s resource).
# Single-node testing: fine to leave this app un-synced and rely on k3s's built-in
# local-path-provisioner instead until you actually have 2+ storage-capable nodes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-longhorn
  namespace: argocd
  labels:
    platform.io/tier: core
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.2   # check for newer: https://github.com/longhorn/longhorn/releases
    helm:
      values: |
        defaultSettings:
          defaultReplicaCount: 2   # bump toward node count as the cluster grows
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
