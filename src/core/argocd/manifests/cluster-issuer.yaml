# Self-signed by default — works with zero external dependencies, which matters
# for a cluster that might be sitting behind NAT with no public DNS. Browsers
# will warn on the untrusted cert; that's expected for an internal platform.
#
# Decision (2026-08-30): staying on self-signed for now — no public domain for
# this cluster yet, and not worth importing platform-ca (below) into every
# device's trust store while this is still solo/testing. Revisit either of
# these when that changes:
#   - Import once, no more warnings: `platform-ca` below is a real CA
#     generated from this self-signed root — grab platform-ca-secret and
#     import it into your OS/browser trust store, and every cert this
#     cluster issues off platform-ca is trusted with no per-service warnings.
#   - Real public domain later: swap to a Let's Encrypt ClusterIssuer
#     (DNS-01 challenge — HTTP-01 needs the cluster reachable from the
#     internet, which a homelab usually isn't). cert-manager's own docs
#     have the exact block for your DNS provider:
#     https://cert-manager.io/docs/configuration/acme/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: self-signed
spec:
  selfSigned: {}
---
# A CA generated FROM the self-signed issuer above, so every other cert this
# cluster issues shares one root — import that one root into your browser/OS
# trust store once, instead of clicking through warnings per-service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: platform-ca
  secretName: platform-ca-secret
  issuerRef:
    name: self-signed
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca:
    secretName: platform-ca-secret
