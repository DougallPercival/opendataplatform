# TODO(you): Keycloak needs a Postgres database, but Postgres itself is a
# Phase 1 (Storage) piece in ARCHITECTURE.md's build order, while Keycloak is
# Phase 0 (Infrastructure). That's a real sequencing wrinkle in the design,
# not solved here — pick one for now:
#   (a) bring Phase 1's CloudNativePG forward and point Keycloak at a
#       dedicated `keycloak` database/role on it, or
#   (b) let Keycloak run in dev mode against its bundled embedded store
#       first, and switch the `db:` block below once Postgres exists.
# Either way, this CR won't reconcile healthy until `db.host` /
# `db.usernameSecret` / `db.passwordSecret` point at something real.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: platform
  namespace: keycloak
spec:
  instances: 1
  hostname:
    hostname: keycloak.platform.local   # TODO: your real hostname once ingress-nginx + cert-manager are up
  http:
    tlsSecret: keycloak-tls
  db:
    vendor: postgres
    host: __TODO_POSTGRES_HOST__
    usernameSecret:
      name: keycloak-db-creds
      key: username
    passwordSecret:
      name: keycloak-db-creds
      key: password
  ingress:
    enabled: false   # platform-gateway will proxy to this later (ARCHITECTURE.md §2); no direct ingress needed yet
