# The Phase 0/Phase 1 sequencing gap noted here previously is resolved:
# postgres-operator + postgres-cluster (wave 0/1, this same argocd/ tree)
# pull CloudNativePG forward instead of leaving Keycloak on a TODO. db.host
# is CNPG's standard "<cluster-name>-rw" read-write Service.
#
# username/passwordSecret below is NOT the Secret CNPG auto-generates from
# bootstrap.initdb — that one lives in the `postgres` namespace and Secrets
# can't cross namespaces, which is exactly what left platform-0 stuck in
# CreateContainerConfigError ("secret platform-postgres-app not found") for
# 40 minutes on 2026-08-30. It's platform-postgres-keycloak-credentials
# instead: a Secret bootstrap/install.sh creates once in `postgres` (see
# postgres-cluster.yaml's managed.roles) and apps/reflector.yaml mirrors into
# this namespace automatically. See docs/known-issues.md for the full story.
#
# Ordering note: this CR is wave 2, postgres-cluster is wave 1, so Postgres
# is applied first — but Argo CD's wave gate doesn't deeply health-check a
# Cluster CR, so "applied" isn't the same as "finished bootstrapping." If
# this shows Degraded right after a fresh install because Postgres is still
# initializing, that's expected — selfHeal retries until it connects.
#
# Correction (2026-08-30): the comment below about the hostname "not blocking
# anything" was only true for external routing. http.tlsSecret is a SEPARATE,
# unconditional requirement — it's Keycloak's own internal HTTPS listener
# cert, needed for the pod to start at all, completely independent of
# ingress.enabled. Discovered via `kubectl describe pod platform-0` showing
# `FailedMount ... secret "keycloak-tls" not found` — nothing in this scaffold
# created that Secret. Fixed below with a Certificate off the platform-ca
# ClusterIssuer (see manifests/cluster-issuer.yaml) so cert-manager creates it.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: platform
  namespace: keycloak
spec:
  instances: 1
  # Not reachable yet either way — ingress.enabled is false below, so this
  # hostname isn't blocking anything right now. Once platform-gateway exists
  # and this gets a real Ingress, resolve it with an /etc/hosts entry on
  # whatever devices need it (decision 2026-08-30: no local DNS server, so
  # /etc/hosts per-device rather than a router-level A record) pointed at
  # whatever IP ingress-nginx picks up from metallb-pool.yaml.
  hostname:
    hostname: keycloak.platform.local
  http:
    tlsSecret: keycloak-tls
  db:
    vendor: postgres
    host: platform-postgres-rw.postgres.svc
    usernameSecret:
      name: platform-postgres-keycloak-credentials
      key: username
    passwordSecret:
      name: platform-postgres-keycloak-credentials
      key: password
  ingress:
    enabled: false   # platform-gateway will proxy to this later (ARCHITECTURE.md §2); no direct ingress needed yet
---
# Keycloak's own internal HTTPS listener cert (http.tlsSecret above) — required
# for the pod to start regardless of ingress.enabled. Off platform-ca so it's
# trusted the same way as every other cert on this cluster once that root is
# imported (see manifests/cluster-issuer.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  dnsNames:
    - keycloak.platform.local
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
