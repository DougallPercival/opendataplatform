# Single instance for now — fine for homelab bring-up and for what Keycloak
# needs on day one. Bump `instances: 3` once this matters enough to want HA
# (odd number, same reasoning as the k3s control-plane note in ARCHITECTURE.md
# §12's DR discussion).
#
# storage.storageClass is left unset on purpose: CNPG will use the cluster's
# default StorageClass, which is Longhorn once src/core/argocd/apps/storage.yaml
# is healthy, or k3s's built-in local-path-provisioner if you're testing
# single-node without Longhorn synced. Set it explicitly if you want to be sure.
#
# bootstrap.initdb still has NO secret: field — CNPG still auto-generates its
# own "platform-postgres-app" Secret at initdb time to create the `keycloak`
# role/database, and that's fine; it's just not what anything actually reads
# credentials from anymore (see managed.roles below). Left as-is rather than
# removed because there's no way to bootstrap a role/database pair without
# SOME credential, and this one now gets immediately superseded.
#
# managed.roles takes over the `keycloak` role's password on an ongoing basis
# from platform-postgres-keycloak-credentials — a Secret bootstrap/install.sh
# creates once (idempotently; never committed to git) IN THIS `postgres`
# namespace. Added 2026-08-30: CNPG's auto-generated secret is namespace-
# scoped to `postgres`, but Keycloak's CR lives in the `keycloak` namespace
# and Kubernetes Secrets can't cross namespaces — Keycloak's pod sat in
# CreateContainerConfigError the whole time ("secret platform-postgres-app
# not found") because of this. apps/reflector.yaml mirrors this Secret into
# `keycloak` (and any future consuming namespace) automatically — see that
# file and docs/known-issues.md for the full story. managed.roles reconciles
# the role's actual password to match the Secret going forward regardless of
# how the role was originally created, so this works whether the cluster is
# brand new or (like this one) already past its initial bootstrap.
#
# Not wired up yet: WAL archiving to MinIO (ARCHITECTURE.md §8's actual backup
# story). MinIO doesn't exist in this repo yet either — Phase 1. Revisit once
# it does; a single-instance, unbacked-up Postgres is fine for getting Keycloak
# running, not fine to leave that way long-term.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-postgres
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie   # confirmed current default for CNPG 1.30 — check for newer before a real install
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        passwordSecret:
          name: platform-postgres-keycloak-credentials
