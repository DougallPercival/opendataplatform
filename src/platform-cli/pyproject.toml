[project]
name = "platform-cli"
version = "0.1.0"
description = "The command-line surface over platform-sdk — ARCHITECTURE.md §4/§10's `platform` command. This pass: `platform me`, `platform workspace {list,create,get}`, `platform dataset {list,create,get,update,delete}` — the same minimal slice platform-sdk covers, one layer up. `platform module ...` / `platform workspace invite` are separate future pieces (module scaffolding and Keycloak Admin API integration respectively — see this package's README)."
requires-python = ">=3.12"
dependencies = [
  # No published version to pin against — this is a sibling package in the
  # same monorepo, not something on PyPI. Local dev: `pip install -e
  # ../platform-sdk` BEFORE `pip install -e .` here, or pip's resolver has
  # nothing to satisfy this with and fails outright. A proper monorepo tool
  # (uv workspace, hatch workspace) would remove this two-step-install
  # requirement — not worth adopting for two packages; revisit once there
  # are enough of these that the manual order becomes a real annoyance
  # (this package's own README documents the two-step install either way).
  "platform-sdk",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
platform = "platform_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_cli"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # same FastAPI-Depends-style false positive as catalog-service — Typer's Option()/Argument() as default args is that library's own required pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
